# SQL Server (CDC) -> Confluent Cloud (Kafka Standard + Schema Registry Essentials) -> PostgreSQL + IBM Db2
#
# Only the data side runs locally: databases, data generator, CloudBeaver and a self-managed
# Kafka Connect worker. Kafka and Schema Registry are in Confluent Cloud (created by ./terraform).
# Cloud endpoints / credentials come from cloud.env, generated by start.sh from terraform outputs.
#
# Same container names and ports as the local-only demo in the parent folder: run one at a time.
name: db-replication-cloud

# Settings shared by both Connect workers (source and sink)
x-connect-common: &connect-common
  build:
    context: ../connect
    args:
      CP_VERSION: ${CP_VERSION:-8.2.0}
      DEBEZIUM_SQLSERVER_VERSION: ${DEBEZIUM_SQLSERVER_VERSION:-3.1.2}
      JDBC_CONNECTOR_VERSION: ${JDBC_CONNECTOR_VERSION:-latest}
  image: db-replication-connect:local

x-connect-env: &connect-env
    # --- Worker: Kafka (Confluent Cloud) with the connect-worker identity (internal topics + worker groups only)
    CC_KAFKA_BOOTSTRAP: ${CC_KAFKA_BOOTSTRAP:-not-set}
    CC_SR_URL: ${CC_SR_URL:-not-set}
    CONNECT_CONFIG_PROVIDERS: env
    CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    CONNECT_BOOTSTRAP_SERVERS: ${CC_KAFKA_BOOTSTRAP:-not-set}
    CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
    # worker-level converters are unused: every connector sets its own Avro converters (and
    # Schema Registry credentials), so the worker identity needs no Schema Registry access
    CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    # lets each connector use its own service account (producer.override.* / consumer.override.*)
    CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All

    # --- Confluent Cloud security of the worker (and of its default producer/consumer/admin clients)
    CONNECT_SECURITY_PROTOCOL: SASL_SSL
    CONNECT_SASL_MECHANISM: PLAIN
    CONNECT_SASL_JAAS_CONFIG: &worker-jaas 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_WORKER_KAFKA_API_KEY:-not-set}" password="${CC_WORKER_KAFKA_API_SECRET:-not-set}";'
    CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_SSL
    CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
    CONNECT_PRODUCER_SASL_JAAS_CONFIG: *worker-jaas
    CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_SSL
    CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
    CONNECT_CONSUMER_SASL_JAAS_CONFIG: *worker-jaas
    CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_SSL
    CONNECT_ADMIN_SASL_MECHANISM: PLAIN
    CONNECT_ADMIN_SASL_JAAS_CONFIG: *worker-jaas

services:

  # ------------------------------------------------------------------ Kafka Connect (self-managed) -> Confluent Cloud
  # Cluster 1: Debezium SQL Server CDC source
  connect-source:
    <<: *connect-common
    hostname: connect-source
    container_name: connect-source
    ports:
      - "8083:8083"
    environment:
      <<: *connect-env
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-source
      # identities used by the connectors of this cluster (referenced as ${env:CC_..._API_KEY})
      CC_WORKER_KAFKA_API_KEY: ${CC_WORKER_KAFKA_API_KEY:-not-set}
      CC_WORKER_KAFKA_API_SECRET: ${CC_WORKER_KAFKA_API_SECRET:-not-set}
      CC_SOURCE_KAFKA_API_KEY: ${CC_SOURCE_KAFKA_API_KEY:-not-set}
      CC_SOURCE_KAFKA_API_SECRET: ${CC_SOURCE_KAFKA_API_SECRET:-not-set}
      CC_SOURCE_SR_API_KEY: ${CC_SOURCE_SR_API_KEY:-not-set}
      CC_SOURCE_SR_API_SECRET: ${CC_SOURCE_SR_API_SECRET:-not-set}
      CONNECT_GROUP_ID: db-replication-connect-source
      # internal topics are created by terraform (1 partition, replication factor 3 is fixed in Confluent Cloud)
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-source-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-source-offsets
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-source-status
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3

  # Cluster 2: JDBC sinks (PostgreSQL, Db2)
  connect-sink:
    <<: *connect-common
    hostname: connect-sink
    container_name: connect-sink
    ports:
      - "8084:8083"
    environment:
      <<: *connect-env
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-sink
      # identities used by the connectors of this cluster (referenced as ${env:CC_..._API_KEY})
      CC_WORKER_KAFKA_API_KEY: ${CC_WORKER_KAFKA_API_KEY:-not-set}
      CC_WORKER_KAFKA_API_SECRET: ${CC_WORKER_KAFKA_API_SECRET:-not-set}
      CC_PGSINK_KAFKA_API_KEY: ${CC_PGSINK_KAFKA_API_KEY:-not-set}
      CC_PGSINK_KAFKA_API_SECRET: ${CC_PGSINK_KAFKA_API_SECRET:-not-set}
      CC_PGSINK_SR_API_KEY: ${CC_PGSINK_SR_API_KEY:-not-set}
      CC_PGSINK_SR_API_SECRET: ${CC_PGSINK_SR_API_SECRET:-not-set}
      CC_DB2SINK_KAFKA_API_KEY: ${CC_DB2SINK_KAFKA_API_KEY:-not-set}
      CC_DB2SINK_KAFKA_API_SECRET: ${CC_DB2SINK_KAFKA_API_SECRET:-not-set}
      CC_DB2SINK_SR_API_KEY: ${CC_DB2SINK_SR_API_KEY:-not-set}
      CC_DB2SINK_SR_API_SECRET: ${CC_DB2SINK_SR_API_SECRET:-not-set}
      CONNECT_GROUP_ID: db-replication-connect-sink
      # internal topics are created by terraform (1 partition, replication factor 3 is fixed in Confluent Cloud)
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-sink-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-sink-offsets
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-sink-status
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3

  # ------------------------------------------------------------------ Source: SQL Server 2019
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    platform: linux/amd64          # no native arm64 image (emulated on Apple Silicon)
    container_name: mssql
    hostname: mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password!123"
      MSSQL_PID: Developer         # CDC needs Developer/Standard/Enterprise
      MSSQL_AGENT_ENABLED: "true"  # CDC capture/cleanup jobs run in SQL Server Agent
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Creates schema + enables CDC, seeds 100 rows/table, then 1 change every 10s per stream
  data-generator:
    build: ../data-generator
    container_name: data-generator
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_HOST: mssql
      MSSQL_PASSWORD: "Password!123"
      MSSQL_DATABASE: demo_db
      ROWS_PER_TABLE: 100
      # seconds between changes (override: OPS_INTERVAL_SECONDS=1 ./start.sh)
      OPS_INTERVAL_SECONDS: ${OPS_INTERVAL_SECONDS:-10}      # random business table
      SENSOR_INTERVAL_SECONDS: ${SENSOR_INTERVAL_SECONDS:-10}  # data_sensors
    restart: on-failure

  # ------------------------------------------------------------------ Sink 1: PostgreSQL
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ Sink 2: IBM Db2
  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64
    container_name: db2
    hostname: db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: db2inst1-pwd
      DBNAME: demo
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "true"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - db2-data:/database
      # The image's setup runs `su - db2inst1 -c db2start` and needs a login shell (loads
      # ~/sqllib/db2profile). On some Docker VMs (e.g. Colima) `su -` doesn't give one, so
      # "db2: command not found" and the DB is never created. These wrappers load the
      # profile themselves and exec the real binary.
      - ../db2-init/db2-wrapper:/usr/local/bin/db2:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2set:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2stop:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2start:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2pd:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2updv121:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2ts:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2cfimp:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2cfexp:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2sampl:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2inidb:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2gcf:ro
      # only executables belong in /var/custom (the image runs every file there)
      - ../db2-init/init-db.sh:/var/custom/init-db.sh:ro
      - ../db2-init/schema.sql:/opt/schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to demo > /dev/null 2>&1 && db2 connect reset > /dev/null 2>&1'"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 600s

  # ------------------------------------------------------------------ Kafbat UI: Confluent Cloud Kafka + Schema Registry + both Connect clusters
  # Uses its own service account (kafbat-xxxxxx): read all topics/subjects, write the connector ones.
  # Connectors are managed through the Connect REST APIs (http://connect-source:8083, http://connect-sink:8083).
  kafbat:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:-v1.4.2}
    container_name: kafbat
    hostname: kafbat
    ports:
      - "8080:8080"
    depends_on:
      - connect-source
      - connect-sink
    environment:
      # login (single user; override with KAFBAT_USER / KAFBAT_PASSWORD)
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFBAT_USER:-devops}
      SPRING_SECURITY_USER_PASSWORD: ${KAFBAT_PASSWORD:-Devops123}
      DYNAMIC_CONFIG_ENABLED: "false"
      # Confluent Cloud Kafka cluster
      KAFKA_CLUSTERS_0_NAME: confluent-cloud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${CC_KAFKA_BOOTSTRAP:-not-set}
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_KAFBAT_KAFKA_API_KEY:-not-set}" password="${CC_KAFBAT_KAFKA_API_SECRET:-not-set}";'
      # Confluent Cloud Schema Registry
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: ${CC_SR_URL:-not-set}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYAUTH_USERNAME: ${CC_KAFBAT_SR_API_KEY:-not-set}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYAUTH_PASSWORD: ${CC_KAFBAT_SR_API_SECRET:-not-set}
      # keys and values are both Avro (the connectors use AvroConverter for both): decode them with
      # Schema Registry by default, so messages show the decoded key/row instead of raw bytes
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: SchemaRegistry
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: SchemaRegistry
      # the two self-managed Connect clusters
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect-source
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect-source:8083
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_NAME: connect-sink
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_ADDRESS: http://connect-sink:8083

  # ------------------------------------------------------------------ Web SQL client for all 3 databases
  cloudbeaver:
    image: dbeaver/cloudbeaver:${CLOUDBEAVER_VERSION:-latest}
    container_name: cloudbeaver
    hostname: cloudbeaver
    ports:
      - "8978:8978"
    environment:
      CB_SERVER_NAME: "Replication demo (Confluent Cloud)"
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: Admin123
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      # pre-configured connections (applied on first start with an empty workspace)
      - ../cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

volumes:
  cloudbeaver-data:
  mssql-data:
  postgres-data:
  db2-data:
