# SQL Server (CDC) -> Confluent Cloud (Kafka Standard + Schema Registry Essentials) -> PostgreSQL + IBM Db2
#
# Only the data side runs locally: databases, data generator, CloudBeaver and a self-managed
# Kafka Connect worker. Kafka and Schema Registry are in Confluent Cloud (created by ./terraform).
# Cloud endpoints / credentials come from cloud.env, generated by start.sh from terraform outputs.
#
# Same container names and ports as the local-only demo in the parent folder: run one at a time.
name: db-replication-cloud

services:

  # ------------------------------------------------------------------ Kafka Connect (self-managed) -> Confluent Cloud
  connect:
    build:
      context: ../connect
      args:
        CP_VERSION: ${CP_VERSION:-8.2.0}
        DEBEZIUM_SQLSERVER_VERSION: ${DEBEZIUM_SQLSERVER_VERSION:-3.1.2}
        JDBC_CONNECTOR_VERSION: ${JDBC_CONNECTOR_VERSION:-latest}
    image: db-replication-connect:local
    hostname: connect
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      # --- Confluent Cloud values, referenced by the connector configs as ${env:CC_...}
      CC_KAFKA_BOOTSTRAP: ${CC_KAFKA_BOOTSTRAP:-not-set}
      CC_KAFKA_API_KEY: ${CC_KAFKA_API_KEY:-not-set}
      CC_KAFKA_API_SECRET: ${CC_KAFKA_API_SECRET:-not-set}
      CC_SR_URL: ${CC_SR_URL:-not-set}
      CC_SR_API_KEY: ${CC_SR_API_KEY:-not-set}
      CC_SR_API_SECRET: ${CC_SR_API_SECRET:-not-set}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider

      # --- Worker
      CONNECT_BOOTSTRAP_SERVERS: ${CC_KAFKA_BOOTSTRAP:-not-set}
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: db-replication-connect
      # internal topics are created by terraform (replication factor 3 is fixed in Confluent Cloud)
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: ${CC_SR_URL:-not-set}
      CONNECT_KEY_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_KEY_CONVERTER_BASIC_AUTH_USER_INFO: ${CC_SR_API_KEY:-not-set}:${CC_SR_API_SECRET:-not-set}
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: ${CC_SR_URL:-not-set}
      CONNECT_VALUE_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_VALUE_CONVERTER_BASIC_AUTH_USER_INFO: ${CC_SR_API_KEY:-not-set}:${CC_SR_API_SECRET:-not-set}
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

      # --- Confluent Cloud security: worker, producers (source), consumers (sink), admin client
      CONNECT_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_KAFKA_API_KEY:-not-set}" password="${CC_KAFKA_API_SECRET:-not-set}";'
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_KAFKA_API_KEY:-not-set}" password="${CC_KAFKA_API_SECRET:-not-set}";'
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_KAFKA_API_KEY:-not-set}" password="${CC_KAFKA_API_SECRET:-not-set}";'
      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_ADMIN_SASL_MECHANISM: PLAIN
      CONNECT_ADMIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CC_KAFKA_API_KEY:-not-set}" password="${CC_KAFKA_API_SECRET:-not-set}";'

  # ------------------------------------------------------------------ Source: SQL Server 2019
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    platform: linux/amd64          # no native arm64 image (emulated on Apple Silicon)
    container_name: mssql
    hostname: mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password!123"
      MSSQL_PID: Developer         # CDC needs Developer/Standard/Enterprise
      MSSQL_AGENT_ENABLED: "true"  # CDC capture/cleanup jobs run in SQL Server Agent
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Creates schema + enables CDC, seeds 100 rows/table, then 1 change every 10s per stream
  data-generator:
    build: ../data-generator
    container_name: data-generator
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_HOST: mssql
      MSSQL_PASSWORD: "Password!123"
      MSSQL_DATABASE: demo_db
      ROWS_PER_TABLE: 100
      # seconds between changes (override: OPS_INTERVAL_SECONDS=1 ./start.sh)
      OPS_INTERVAL_SECONDS: ${OPS_INTERVAL_SECONDS:-10}      # random business table
      SENSOR_INTERVAL_SECONDS: ${SENSOR_INTERVAL_SECONDS:-10}  # data_sensors
    restart: on-failure

  # ------------------------------------------------------------------ Sink 1: PostgreSQL
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ Sink 2: IBM Db2
  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64
    container_name: db2
    hostname: db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: db2inst1-pwd
      DBNAME: demo
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "true"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - db2-data:/database
      # The image's setup runs `su - db2inst1 -c db2start` and needs a login shell (loads
      # ~/sqllib/db2profile). On some Docker VMs (e.g. Colima) `su -` doesn't give one, so
      # "db2: command not found" and the DB is never created. These wrappers load the
      # profile themselves and exec the real binary.
      - ../db2-init/db2-wrapper:/usr/local/bin/db2:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2set:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2stop:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2start:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2pd:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2updv121:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2ts:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2cfimp:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2cfexp:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2sampl:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2inidb:ro
      - ../db2-init/db2-wrapper:/usr/local/bin/db2gcf:ro
      # only executables belong in /var/custom (the image runs every file there)
      - ../db2-init/init-db.sh:/var/custom/init-db.sh:ro
      - ../db2-init/schema.sql:/opt/schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to demo > /dev/null 2>&1 && db2 connect reset > /dev/null 2>&1'"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 600s

  # ------------------------------------------------------------------ Web SQL client for all 3 databases
  cloudbeaver:
    image: dbeaver/cloudbeaver:${CLOUDBEAVER_VERSION:-latest}
    container_name: cloudbeaver
    hostname: cloudbeaver
    ports:
      - "8978:8978"
    environment:
      CB_SERVER_NAME: "Replication demo (Confluent Cloud)"
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: Admin123
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      # pre-configured connections (applied on first start with an empty workspace)
      - ../cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

volumes:
  cloudbeaver-data:
  mssql-data:
  postgres-data:
  db2-data:
