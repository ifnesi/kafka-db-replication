{
  "folders": {
    "Replication demo": {}
  },
  "connections": {
    "mssql-source": {
      "provider": "sqlserver",
      "driver": "microsoft",
      "name": "1 - SQL Server (source)",
      "description": "Source database (CDC enabled), schema dbo",
      "save-password": true,
      "folder": "Replication demo",
      "configuration": {
        "host": "mssql",
        "port": "1433",
        "database": "demo_db",
        "type": "dev",
        "auth-model": "native",
        "user": "sa",
        "password": "Password!123",
        "url": "jdbc:sqlserver://mssql:1433;databaseName=demo_db;encrypt=false;trustServerCertificate=true"
      }
    },
    "postgres-target": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "2 - PostgreSQL (target)",
      "description": "Replica, schema public",
      "save-password": true,
      "folder": "Replication demo",
      "configuration": {
        "host": "postgres",
        "port": "5432",
        "database": "demo",
        "type": "dev",
        "auth-model": "native",
        "user": "postgres",
        "password": "postgres"
      }
    },
    "db2-target": {
      "provider": "db2",
      "driver": "db2",
      "name": "3 - IBM Db2 (target)",
      "description": "Replica, schema DB2INST1 (lowercase quoted names)",
      "save-password": true,
      "folder": "Replication demo",
      "configuration": {
        "host": "db2",
        "port": "50000",
        "database": "demo",
        "type": "dev",
        "auth-model": "native",
        "user": "db2inst1",
        "password": "db2inst1-pwd"
      }
    }
  }
}